<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a12;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#fff}
canvas#gl{position:fixed;z-index:1;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;z-index:2;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:.85;mix-blend-mode:difference}

.slot{position:relative;width:46px;height:46px;border-radius:6px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.slot.sel{border-color:#fff;background:rgba(255,255,255,.25);transform:translateY(-3px);transition:transform .12s}
.slot canvas{width:34px;height:34px;image-rendering:pixelated}
.slot b{position:absolute;right:2px;bottom:0;font-size:12px;text-shadow:1px 1px 0 #000}
.btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;backdrop-filter:blur(2px)}
.btn:active,.btn.on{background:rgba(255,255,255,.42)}
#bJump{right:max(26px,env(safe-area-inset-right));bottom:70px;width:78px;height:78px}
#bDown{right:max(112px,calc(env(safe-area-inset-right) + 86px));bottom:44px;width:56px;height:56px;display:none}
#bMenu{right:max(12px,env(safe-area-inset-right));top:10px;width:44px;height:44px;font-size:18px}
#bCam{right:calc(max(12px,env(safe-area-inset-right)) + 54px);top:10px;width:44px;height:44px;font-size:18px}
#bInv{right:calc(max(12px,env(safe-area-inset-right)) + 108px);top:10px;width:44px;height:44px;font-size:18px}
#bFly{right:calc(max(12px,env(safe-area-inset-right)) + 162px);top:10px;width:44px;height:44px;font-size:18px}
#bRun{left:max(40px,env(safe-area-inset-left));bottom:200px;width:50px;height:50px;font-size:16px}
#stickBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:none}

#info{position:absolute;left:max(8px,env(safe-area-inset-left));top:6px;font-size:11px;opacity:.8;text-shadow:1px 1px 0 #000;line-height:1.4}

.mb:active{background:#3f8f64}.mb.alt{background:#27455a}.mb.red{background:#7a2e2e}

#invQ{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:2px solid #2e6b4a;background:#0b1a12;color:#fff;font-size:15px;user-select:text;-webkit-user-select:text;touch-action:auto}

#bar{width:220px;height:10px;background:#0006;border-radius:6px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#9be37c}
#err{position:fixed;left:0;right:0;bottom:0;background:#a00;color:#fff;font-size:12px;padding:6px;z-index:99;display:none}

</head>

  <button class="mb alt" id="mNews">O que mudou</button>
  <button class="mb red" id="mNew">Novo mundo</button>

 return L(L(L(hash(xi,yi,zi,s),hash(xi+1,yi,zi,s),u),L(hash(xi,yi+1,zi,s),hash(xi+1,yi+1,zi,s),u),v),L(L(hash(xi,yi,zi+1,s),hash(xi+1,yi,zi+1,s),u),L(hash(xi,yi+1,zi+1,s),hash(xi+1,yi+1,zi+1,s),u),v),w)}

 else{SEED=(Math.random()*1e6|0)+1;let found=false;for(let r=0;r<200&&!found;r++){const a=r*2.4,d=r*6,x=Math.floor(Math.cos(a)*d),z=Math.floor(Math.sin(a)*d);if(heightAt(x,z)>SEA+1&&heightAt(x,z)<40){P.x=x+.5;P.z=z+.5;P.y=heightAt(x,z)+2;found=true}}
  if(!found){P.x=.5;P.z=.5;P.y=heightAt(0,0)+2}}
 if(SET.mode==='survival')HOT=HOT.map(i=>INV[i]>0?i:0);
 P.byaw=P.yaw;refreshUI();syncMenu();requestAnimationFrame(frame)}
window.addEventListener('pagehide',saveWorld);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveWorld()});
start();
